services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  RatingStar\Seal\:
    resource: '../Classes/*'

  # PSR-15 middleware is resolved by TYPO3's middleware dispatcher via the
  # container, so it must be public.
  RatingStar\Seal\Middleware\JsonLdInjector:
    public: true

  # JsonLdViewHelper fetches this provider via GeneralUtility::makeInstance() at
  # render time (ViewHelpers can't reliably use constructor injection – Fluid
  # instantiates them at parse time too). makeInstance only returns a
  # container-wired instance for PUBLIC services, so the provider must be public.
  RatingStar\Seal\Service\JsonLdProvider:
    public: true
